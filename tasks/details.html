<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stalwart Suite — نقشه‌راه کامل پروژه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root{
    --bg:#080b14;
    --bg-2:#0c1120;
    --sidebar:#0a0f1c;
    --card:#111829;
    --card-2:#161f34;
    --border:#1f2a44;
    --border-2:#2a3854;
    --text:#e8eef9;
    --muted:#8b98b3;
    --muted-2:#6b7894;
    --blue:#5b9dff;
    --purple:#a06bff;
    --green:#2dd4a7;
    --orange:#ff9d4d;
    --pink:#ff5c8a;
    --yellow:#f5c451;
    --red:#ff4d6d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.85;
    font-size:15px;
    overflow-x:hidden;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg-2)}
  ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4a6a}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}

  /* LAYOUT */
  .app{
    display:grid;
    grid-template-columns:290px 1fr;
    min-height:100vh;
  }

  /* SIDEBAR */
  .sidebar{
    background:linear-gradient(180deg,var(--sidebar),#070a14);
    border-left:1px solid var(--border);
    padding:24px 16px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 8px 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:12px;
  }
  .brand-logo{
    width:42px;height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--purple),var(--blue));
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;
    box-shadow:0 8px 24px rgba(124,92,255,.35);
  }
  .brand-text h1{
    font-size:1rem;
    font-weight:800;
    background:linear-gradient(120deg,#fff,#a06bff);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    line-height:1.3;
  }
  .brand-text p{font-size:.72rem;color:var(--muted-2);line-height:1.3}

  .nav-section{
    font-size:.7rem;
    font-weight:700;
    letter-spacing:1px;
    color:var(--muted-2);
    text-transform:uppercase;
    padding:16px 10px 6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border-radius:10px;
    color:#c5cfe0;
    font-size:.88rem;
    font-weight:500;
    cursor:pointer;
    transition:.15s;
    border:1px solid transparent;
    user-select:none;
  }
  .nav-item:hover{background:var(--card);color:#fff;border-color:var(--border)}
  .nav-item.active{
    background:linear-gradient(135deg,rgba(91,157,255,.15),rgba(124,92,255,.1));
    color:#fff;
    border-color:rgba(91,157,255,.35);
  }
  .nav-item .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--tc,var(--blue));
    flex-shrink:0;
    box-shadow:0 0 8px var(--tc,var(--blue));
  }
  .nav-item .nav-label{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .nav-item .nav-id{
    font-family:'JetBrains Mono',monospace;
    font-size:.65rem;
    color:var(--muted-2);
    direction:ltr;
  }
  .nav-item .nav-progress{
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    color:var(--muted);
    background:var(--bg-2);
    padding:1px 7px;
    border-radius:6px;
    border:1px solid var(--border);
  }
  .nav-item.done .nav-progress{
    color:var(--green);
    border-color:rgba(45,212,167,.4);
    background:rgba(45,212,167,.08);
  }

  .sidebar-footer{
    margin-top:auto;
    padding-top:16px;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .mini-progress{
    padding:10px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
  }
  .mini-progress-label{
    display:flex;
    justify-content:space-between;
    font-size:.75rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  .mini-progress-label b{color:var(--text);font-weight:700}
  .bar{
    height:6px;
    background:var(--bg-2);
    border-radius:6px;
    overflow:hidden;
  }
  .bar > div{
    height:100%;
    background:linear-gradient(90deg,var(--green),var(--blue));
    border-radius:6px;
    transition:width .4s;
  }
  .sidebar-actions{
    display:flex;
    gap:6px;
  }
  .btn{
    padding:8px 12px;
    border-radius:10px;
    font-family:inherit;
    font-size:.8rem;
    font-weight:600;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--card);
    color:#c5cfe0;
    transition:.15s;
    flex:1;
    text-align:center;
  }
  .btn:hover{background:var(--card-2);color:#fff;border-color:var(--border-2)}
  .btn-primary{
    background:linear-gradient(135deg,var(--blue),var(--purple));
    color:#fff;
    border-color:transparent;
  }
  .btn-primary:hover{filter:brightness(1.1)}
  .btn-danger:hover{color:var(--red);border-color:rgba(255,77,109,.4)}

  /* MAIN */
  .main{
    padding:40px 48px 80px;
    max-width:1100px;
    width:100%;
  }

  /* HERO */
  .hero{
    padding:20px 0 40px;
    border-bottom:1px solid var(--border);
    margin-bottom:36px;
  }
  .hero-badge{
    display:inline-block;
    padding:5px 14px;
    border-radius:999px;
    background:rgba(124,92,255,.1);
    border:1px solid rgba(124,92,255,.3);
    color:var(--purple);
    font-size:12px;
    font-weight:600;
    margin-bottom:16px;
  }
  .hero h2{
    font-size:clamp(1.8rem,3.5vw,2.6rem);
    font-weight:800;
    line-height:1.2;
    background:linear-gradient(120deg,#fff 20%,#7c5cff 60%,#5b9dff 90%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:14px;
  }
  .hero p{color:var(--muted);max-width:720px;font-size:1rem}

  /* VIEW */
  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .view-head{
    display:flex;
    align-items:flex-start;
    gap:20px;
    margin-bottom:32px;
    flex-wrap:wrap;
  }
  .back-btn{
    padding:9px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:#c5cfe0;
    cursor:pointer;
    font-family:inherit;
    font-size:.85rem;
    font-weight:600;
    transition:.15s;
    flex-shrink:0;
  }
  .back-btn:hover{background:var(--card-2);color:#fff}

  .task-title-block{flex:1;min-width:260px}
  .task-title-block h2{
    font-size:1.9rem;
    font-weight:800;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .task-title-block .tnum{
    width:44px;height:44px;
    border-radius:12px;
    background:color-mix(in srgb, var(--tc) 15%, transparent);
    border:1px solid color-mix(in srgb, var(--tc) 40%, transparent);
    color:var(--tc);
    font-weight:800;
    font-size:1.15rem;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .task-title-block .meta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .meta-chip{
    font-size:.75rem;
    padding:3px 10px;
    border-radius:8px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--muted);
  }
  .meta-chip.id{
    font-family:'JetBrains Mono',monospace;
    color:var(--tc);
    border-color:color-mix(in srgb, var(--tc) 30%, transparent);
    background:color-mix(in srgb, var(--tc) 8%, transparent);
  }

  .task-goal-box{
    background:linear-gradient(135deg,color-mix(in srgb, var(--tc) 8%, transparent), transparent);
    border:1px solid color-mix(in srgb, var(--tc) 25%, transparent);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:28px;
    position:relative;
  }
  .task-goal-box::before{
    content:'هدف';
    position:absolute;
    top:-10px;right:22px;
    font-size:.7rem;
    font-weight:700;
    padding:2px 10px;
    border-radius:6px;
    background:var(--tc);
    color:#0a0e1a;
  }
  .task-goal-box p{font-size:1rem;color:#dde6f5;font-weight:500}

  .detail-section{margin-bottom:36px}
  .detail-section h3{
    font-size:1.15rem;
    font-weight:700;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
  }
  .detail-section h3 .ic{
    width:32px;height:32px;
    border-radius:9px;
    background:var(--card);
    border:1px solid var(--border);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:.95rem;
  }
  .detail-section .count{
    margin-right:auto;
    font-family:'JetBrains Mono',monospace;
    font-size:.8rem;
    color:var(--muted);
    background:var(--card);
    padding:2px 10px;
    border-radius:8px;
    border:1px solid var(--border);
  }

  /* SUBTASKS */
  .subtasks{display:flex;flex-direction:column;gap:8px}
  .subtask{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    cursor:pointer;
    transition:.15s;
    user-select:none;
  }
  .subtask:hover{border-color:var(--border-2);background:var(--card-2)}
  .subtask.checked{
    background:linear-gradient(90deg,rgba(45,212,167,.06),var(--card));
    border-color:rgba(45,212,167,.3);
  }
  .subtask.checked .st-text{
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:rgba(45,212,167,.5);
  }
  .checkbox{
    width:20px;height:20px;
    border-radius:6px;
    border:2px solid var(--border-2);
    flex-shrink:0;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.15s;
    background:var(--bg-2);
  }
  .subtask.checked .checkbox{
    background:var(--green);
    border-color:var(--green);
    color:#0a0e1a;
  }
  .checkbox svg{width:12px;height:12px;display:none}
  .subtask.checked .checkbox svg{display:block}
  .st-text{font-size:.92rem;color:#d5deee;line-height:1.6;flex:1}
  .st-num{
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    color:var(--muted-2);
    margin-left:auto;
    align-self:center;
  }

  /* DOCS */
  .docs-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;
  }
  .doc-link{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    transition:.15s;
    color:#d5deee;
    text-decoration:none;
    font-size:.88rem;
    font-weight:500;
  }
  .doc-link:hover{
    background:var(--card-2);
    border-color:var(--blue);
    color:#fff;
    text-decoration:none;
    transform:translateY(-2px);
  }
  .doc-link .arrow{
    margin-right:auto;
    color:var(--muted-2);
    font-size:1rem;
    transition:.15s;
  }
  .doc-link:hover .arrow{color:var(--blue);transform:translateX(-3px)}

  /* QUESTIONS */
  .questions{display:flex;flex-direction:column;gap:10px}
  .question{
    padding:14px 18px;
    background:linear-gradient(90deg,rgba(245,196,81,.06),var(--card));
    border:1px solid rgba(245,196,81,.25);
    border-right:3px solid var(--yellow);
    border-radius:10px;
    font-size:.92rem;
    color:#e8dfc5;
    line-height:1.7;
  }
  .question::before{
    content:'؟';
    color:var(--yellow);
    font-weight:800;
    margin-left:8px;
    font-size:1.05rem;
  }

  /* TIPS */
  .tips{display:flex;flex-direction:column;gap:10px}
  .tip{
    padding:14px 18px;
    background:linear-gradient(90deg,rgba(91,157,255,.06),var(--card));
    border:1px solid rgba(91,157,255,.2);
    border-right:3px solid var(--blue);
    border-radius:10px;
    font-size:.92rem;
    color:#cddaf0;
    line-height:1.7;
  }
  .tip::before{
    content:'💡';
    margin-left:8px;
  }

  /* OUTPUT */
  .output-box{
    padding:20px 22px;
    background:linear-gradient(135deg,rgba(45,212,167,.08),rgba(45,212,167,.02));
    border:1px solid rgba(45,212,167,.3);
    border-radius:14px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .output-box .ok{
    width:36px;height:36px;
    border-radius:10px;
    background:var(--green);
    color:#0a0e1a;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:1.1rem;
    flex-shrink:0;
  }
  .output-box .body{flex:1}
  .output-box .lbl{font-size:.75rem;color:var(--green);font-weight:700;margin-bottom:4px;letter-spacing:.5px}
  .output-box p{color:#b8e6d6;font-size:.95rem}

  /* DEPENDENCIES */
  .deps{display:flex;flex-wrap:wrap;gap:8px}
  .dep{
    padding:6px 12px;
    border-radius:8px;
    background:var(--card);
    border:1px solid var(--border);
    font-family:'JetBrains Mono',monospace;
    font-size:.78rem;
    color:#c5cfe0;
    cursor:pointer;
    transition:.15s;
  }
  .dep:hover{
    border-color:var(--purple);
    color:var(--purple);
    background:rgba(160,107,255,.08);
  }

  /* DASHBOARD */
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
    margin-bottom:36px;
  }
  .stat{
    padding:20px 22px;
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--border);
    border-radius:14px;
    position:relative;
    overflow:hidden;
  }
  .stat::before{
    content:'';
    position:absolute;
    top:0;right:0;left:0;
    height:2px;
    background:var(--sc,var(--blue));
  }
  .stat .num{
    font-size:2rem;
    font-weight:800;
    font-family:'JetBrains Mono',monospace;
    color:var(--sc,var(--blue));
    line-height:1;
    margin-bottom:6px;
  }
  .stat .lbl{
    font-size:.82rem;
    color:var(--muted);
  }

  .filter-row{
    display:flex;
    gap:8px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .filter-btn{
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:#c5cfe0;
    font-family:inherit;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .filter-btn:hover{border-color:var(--border-2)}
  .filter-btn.active{
    background:linear-gradient(135deg,var(--blue),var(--purple));
    color:#fff;
    border-color:transparent;
  }

  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:18px;
  }
  .card{
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    cursor:pointer;
    transition:.2s;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card::before{
    content:'';
    position:absolute;
    top:0;right:0;left:0;
    height:3px;
    background:var(--tc,var(--blue));
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:color-mix(in srgb, var(--tc) 40%, transparent);
    box-shadow:0 20px 50px -25px var(--tc);
  }
  .card-head{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .card-num{
    width:38px;height:38px;
    border-radius:10px;
    background:color-mix(in srgb, var(--tc) 15%, transparent);
    border:1px solid color-mix(in srgb, var(--tc) 40%, transparent);
    color:var(--tc);
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-size:1rem;
  }
  .card-head h3{
    font-size:1.1rem;
    font-weight:700;
    line-height:1.3;
    margin-bottom:2px;
  }
  .card-id{
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    color:var(--muted-2);
    direction:ltr;
  }
  .card-goal{
    font-size:.85rem;
    color:var(--muted);
    line-height:1.6;
  }
  .card-foot{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:auto;
    padding-top:12px;
    border-top:1px dashed var(--border);
    font-size:.78rem;
    color:var(--muted);
  }
  .card-foot .prog-num{
    font-family:'JetBrains Mono',monospace;
    color:var(--tc);
    font-weight:700;
  }
  .card-foot .mini-bar{
    flex:1;
    height:5px;
    background:var(--bg-2);
    border-radius:4px;
    overflow:hidden;
  }
  .card-foot .mini-bar > div{
    height:100%;
    background:var(--tc);
    border-radius:4px;
  }

  /* DIAGRAM */
  .diagram-wrap{
    background:linear-gradient(180deg,var(--card),var(--bg-2));
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px 20px;
    overflow-x:auto;
  }
  .mermaid{display:flex;justify-content:center;min-width:max-content}

  /* TEAM */
  .team-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
  }
  .member{
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--border);
    border-radius:16px;
    padding:26px 22px;
    position:relative;
    overflow:hidden;
  }
  .member::after{
    content:'';
    position:absolute;
    inset:auto 0 0 0;
    height:4px;
    background:var(--mc);
  }
  .avatar{
    width:60px;height:60px;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;
    background:color-mix(in srgb, var(--mc) 15%, transparent);
    border:1px solid color-mix(in srgb, var(--mc) 40%, transparent);
    margin-bottom:14px;
  }
  .member h3{font-size:1.1rem;margin-bottom:4px}
  .member .role{color:var(--muted);font-size:.85rem;margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    padding:4px 10px;
    border-radius:999px;
    background:color-mix(in srgb, var(--mc) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--mc) 35%, transparent);
    color:var(--mc);
    direction:ltr;
    cursor:pointer;
    transition:.15s;
  }
  .chip:hover{background:color-mix(in srgb, var(--mc) 25%, transparent)}

  /* KPI STRIP */
  .kpi-strip{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 20px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .kpi-strip .kpi-item{
    display:flex;align-items:center;gap:8px;
    font-size:.85rem;color:var(--muted);
  }
  .kpi-strip .kpi-item b{
    font-family:'JetBrains Mono',monospace;
    color:var(--text);
    font-weight:700;
  }

  /* SEARCH */
  .search-box{
    padding:10px 14px;

const STORAGE_KEY = 'stalwart-suite-progress-v1';
let progress = loadProgress();
let currentView = { type:'dashboard' };
let currentFilter = 'all';
let searchQuery = '';

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  updateGlobalProgress();
  updateNavProgress();
}
function isDone(taskId, idx){
  return !!progress[`${taskId}:${idx}`];
}
function toggleSubtask(taskId, idx){
  const key = `${taskId}:${idx}`;
  if(progress[key]) delete progress[key];
  else progress[key] = true;
  saveProgress();
  render();
}
function taskProgress(task){
  const total = task.subtasks.length;
  const done = task.subtasks.filter((_,i)=>isDone(task.id,i)).length;
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}
function globalProgress(){
  let done=0, total=0;
  TASKS.forEach(t=>{
    const p = taskProgress(t);
    done += p.done; total += p.total;
  });
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}
function toFa(n){ return String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }

const root = document.getElementById('view-root');
const navTasks = document.getElementById('nav-tasks');

function render(){
  renderNav();
  if(currentView.type === 'dashboard') renderDashboard();
  else if(currentView.type === 'task') renderTask(currentView.id);
  else if(currentView.type === 'architecture') renderArchitecture();
  else if(currentView.type === 'workflow') renderWorkflow();
  else if(currentView.type === 'team') renderTeam();
  updateGlobalProgress();
  window.scrollTo({top:0, behavior:'instant'});
}

function renderNav(){
  navTasks.innerHTML = TASKS.map(t=>{
    const p = taskProgress(t);
    const done = p.pct === 100;
    const active = currentView.type==='task' && currentView.id===t.id;
    return `
      <div class="nav-item ${active?'active':''} ${done?'done':''}" data-task="${t.id}" style="--tc:${t.color}">
        <span class="dot"></span>
        <span class="nav-label">${t.titleFa}</span>
        <span class="nav-progress">${toFa(p.done)}/${toFa(p.total)}</span>
      </div>
    `;
  }).join('');

  navTasks.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=>{ currentView = {type:'task', id: el.dataset.task}; render(); };
  });
}

function updateNavProgress(){
  renderNav();
  document.querySelectorAll('.nav-item[data-view]').forEach(el=>{
    el.classList.toggle('active', currentView.type === el.dataset.view);
  });
}

function updateGlobalProgress(){
  const g = globalProgress();
  document.getElementById('global-progress-bar').style.width = g.pct + '%';
  document.getElementById('global-progress-label').textContent = toFa(g.pct) + '٪';
}

/* ═══ IMPORT / EXPORT ═══ */
function exportProgress(){
  const blob = new Blob([JSON.stringify({ version:1, progress, exportedAt:new Date().toISOString() }, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `stalwart-suite-progress-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('پیشرفت با موفقیت Export شد ✓');
}
function importProgress(){
  document.getElementById('import-file').click();
}
document.getElementById('import-file').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.progress && typeof data.progress === 'object'){
        progress = data.progress;
        saveProgress();
        render();
        toast('پیشرفت با موفقیت Import شد ✓');
      } else { toast('فایل نامعتبر است ✗'); }
    }catch(err){ toast('خطا در خواندن فایل ✗'); }
  };
  reader.readAsText(file);
  e.target.value = '';
};
function resetProgress(){
  if(!confirm('مطمئنی می‌خواهی همهٔ پیشرفت را پاک کنی؟ این عمل قابل بازگشت نیست.')) return;
  progress = {};
  saveProgress();
  render();
  toast('همهٔ پیشرفت پاک شد');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2400);
}

/* ═══ INIT ═══ */
render();
